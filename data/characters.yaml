# =============================================================
# data/characters.yaml
# Central registry for all NPCs and Player Characters.
# Used by the {{< npc "Name" >}} and {{< pc "Name" >}} shortcodes.
#
# FORMAT:
#   "Display Name":
#     path: /path/to/page    (relative to content/, no .md)
#     type: pc | npc | location
#
# HOW TO ADD A NEW CHARACTER:
#   1. Create their .md file in Hugo content/
#   2. Add one entry here
#   3. Use {{< npc "Name" >}} anywhere — Hugo finds the page
# =============================================================

